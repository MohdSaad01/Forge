name: CPU test suite

# Runs Forge's CPU-only test surface on ordinary GitHub-hosted runners (no
# GPU available there). CUDA-specific tests already skip cleanly via
# pytest.mark.skipif(not is_cuda_available()) -- see tests/test_cuda_*.py
# and tests/test_*_example_cuda_integration.py -- so this workflow exercises
# roughly half the suite (every CPU-only test file) plus the CPU paths of
# the rest; it deliberately makes no claim about CUDA correctness. CUDA
# behavior remains hardware-verified manually on the reference GPU per
# docs/development/development-environment.md, as CLAUDE.md requires
# ("CUDA support must be real and hardware-tested; never simulate GPU
# behavior").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  # Milestone 93: `test` above only ever exercises `pip install -e .` against
  # the source tree, which would never have caught the CUDA kernel source
  # (kernels.cu) being silently missing from the built wheel -- a real
  # packaging regression found and fixed in Milestone 93. This job instead
  # builds Forge's actual wheel and installs it into a fresh venv, so package
  # discovery/data/dependency/entry-point regressions are caught here even
  # though this runner has no GPU (CUDA correctness itself stays hardware-
  # verified manually per docs/development/development-environment.md).
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build pytest
      - run: python -m pytest tests/test_packaging_smoke.py -q
