[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
dynamic = ["version"]
description = "A neural-network framework for building and training models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mohd Saad Ansari", email = "ansari.mohdsaad25@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
forge = "forge.cli.main:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
"forge.backend.cuda" = ["kernels.cu"]

[tool.setuptools.dynamic]
version = { attr = "forge.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
